
plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
}

application {
    mainClass = 'com.bassstarling.receiptmanager.ReceiptApp'
}
